[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-forex-paper-trader"
version = "0.1.0"
description = "Leakage-aware EUR/USD research with local-only paper execution and risk simulation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AI/ML Portfolio Project" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
fx-paper = "fx_paper.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
